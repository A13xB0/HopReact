# HopReact configuration reference.
#
# Copy to config.yaml and edit. Every value shown here is the built-in
# default (see internal/config.Default), so you only need to keep the keys
# you actually change — anything you leave out keeps the default rather
# than becoming empty.
#
# The path to this file is the ONE thing configured outside it:
#   -config <path>   →   $HOPREACT_CONFIG   →   ./config.yaml

# Where the SQLite database lives. The directory must be writable: SQLite
# puts its -wal and -shm sidecar files next to the database. Must be a real
# local filesystem — never NFS/SMB, where file locking is unreliable.
data_dir: ./data

site:
  # Public base URL, used to build the OAuth redirect URI and the links in
  # Discord messages. Must match the redirect URI registered in the Discord
  # developer portal exactly.
  base_url: http://localhost:8080
  name: HopReact
  # Shown in the footer and linked from every alert. Point this at the
  # privacy policy on your main site.
  privacy_policy_url: ""

http:
  listen: ":8080"

corescope:
  # The CoreScope instance to watch. Public and unauthenticated — the same
  # instance HopReach reads.
  api_url: https://scotmesh-corescope.mm7roq.compute.oarc.uk
  request_timeout_seconds: 30

discord:
  # From the Discord developer portal (Applications → your app).
  client_id: ""
  client_secret: ""
  # Bot token. This is what actually sends the DMs, so it is the one
  # credential that must outlive a user's session.
  bot_token: ""
  # The guild the bot lives in. Sign-in adds the user here (OAuth scope
  # guilds.join) so the bot shares a server with them — without that,
  # Discord will not let a bot DM a user at all.
  guild_id: ""
  # Discord user ID to notify about HopReact itself: failed polls, and the
  # blast-radius breaker tripping. Left empty, those only go to the log.
  operator_user_id: ""

poll:
  # How often to poll CoreScope. Two cheap GETs, so this is mostly about
  # how quickly an outage is noticed — with a one-hour minimum threshold
  # there is nothing to gain below a minute or two, and hammering someone
  # else's public API to no purpose is rude. Floored at 1m by Validate.
  interval: 5m

  # --- safety rails: see internal/alert -----------------------------------
  # These exist so a CoreScope outage can never be mistaken for "the whole
  # mesh went offline" and fan out to every user at once.

  # A poll returning fewer nodes than this is treated as broken rather than
  # believed. The real feed carries hundreds; a handful means truncation or
  # an error page that happened to parse.
  min_nodes: 100
  # ...and likewise if it drops below this fraction of the largest recent
  # poll, which catches partial responses that still clear min_nodes.
  min_node_fraction: 0.5
  # A feed can return a plausible-looking full node list that is frozen
  # (CoreScope's own upstream died). If no node's last_seen advances for
  # this many consecutive polls, treat the data as stale and don't evaluate
  # — the mesh going completely silent looks identical, and being wrong in
  # that direction is far cheaper than alerting everyone.
  max_polls_without_advance: 2

  # How many packets each poll reads to work out which nodes are carrying
  # which kinds of traffic. One request, regardless of how many nodes are
  # being watched. The mesh runs about five packets a minute, so 600 covers
  # roughly two hours — enough overlap that a few missed polls lose nothing.
  # A high-water mark stops a re-read page being counted twice.
  packet_limit: 600

  # How much history to read once, on the very first run, so the per-type view
  # has something to show immediately instead of reading "never" against
  # everything for its first day — and so rules have evidence to judge, since
  # a rule with none deliberately stays quiet. CoreScope does the windowing,
  # so this is a single request: 24 hours is about 4,600 packets and takes a
  # couple of seconds. Set to 0 to skip it.
  #
  # Note this does not store packets. Only the time each kind of traffic was
  # last seen per node is kept, which is at most a few thousand rows however
  # busy the mesh gets.
  backfill_hours: 24

alerts:
  # A watch must stay over its threshold for this many consecutive polls
  # before it alerts. Stops a node hovering right on the boundary from
  # emitting a stream of down/up messages.
  confirm_polls: 2
  # Ceiling on how many watches may enter the alerting state in a single
  # poll before the breaker trips, freezes the state machine and notifies
  # only the operator. Whichever of the two limits is hit first wins.
  max_new_alerts_per_poll: 10
  max_new_alert_fraction: 0.25
  # How many watches one account may hold.
  max_watches_per_user: 50

# A public status board at /status. Off by default — publishing your mesh
# should be a decision, not a surprise.
status:
  enabled: false
  title: "Repeater status"

  # Restrict the board to repeaters inside a region, as a GeoJSON file you
  # mount into the container. Leave empty to list every repeater in the feed.
  #
  # Worth setting on a bridged mesh: of 659 repeaters on the instance this was
  # built against, only 71 are actually in Scotland — the rest arrive over
  # MQTT from Ireland, the Isle of Man and northern England. Without a region
  # you are publishing mostly other people's infrastructure.
  #
  # Accepts a Feature, FeatureCollection, Polygon or MultiPolygon. Repeaters
  # that advertise no location can never be placed, so they are left off.
  geojson_path: ""
  # Overrides the name found in the GeoJSON, if you want a friendlier one.
  region_name: ""

  # The escalation ladder, in hours of silence. A repeater is judged on the
  # most recent thing seen of it — an advert OR traffic it passed on — so
  # either one arriving puts it back to green.
  #
  # Adverts are the anchor: a repeater beacons on its own schedule whether or
  # not anyone is using the mesh. Measured on a live mesh, a healthy repeater
  # inside a well-covered region goes over 12h about 10% of the time and over
  # 24h about 3%, so these are chosen to make red mean something.
  quiet_hours: 12     # amber — worth a glance
  concern_hours: 24   # orange — worth asking about
  alarm_hours: 36     # red — it has almost certainly stopped

  # The "gone quiet recently" strip at the top.
  recent_hours: 24
  recent_limit: 10

  # Drop anything not seen for this long, rather than showing a permanent red
  # for a node nobody expects back. A board is for things that are supposed to
  # be working. Seven days matches CoreScope's own node retention, so a
  # repeater leaves this page at about the point it leaves the feed. Its
  # observer retention is 14 days, so an observer may linger there a little
  # longer than here. 0 disables the cutoff.
  stale_after_days: 7

  # What counts as backbone. Either measure qualifies, because they answer
  # different questions: traffic share is how much of the mesh's traffic
  # actually goes through a node, bridge score is how many routes across the
  # mesh depend on it. A quiet chokepoint scores low on the first and high on
  # the second, and losing it still splits the mesh.
  #
  # These follow CoreScope's own labelling (bridge >= 0.2 "Important",
  # traffic >= 0.3 "Moderate"). On the live mesh they pick 14 of 71 Scottish
  # repeaters — about the right size for a backbone list.
  core_bridge_score: 0.2
  core_traffic_share: 0.3
  # Repeaters that count as backbone whatever they score. The scores describe
  # the mesh as it is; you know things it doesn't — a hilltop site everything
  # will lean on once the next few nodes appear, or one that looks quiet today
  # only because its neighbours are down. Matched as a case-insensitive prefix
  # of the public key, so a short hash is enough.
  core_keys: []
  #  - "02f1fec873"   # West Lomond

  # How long a repeater stays in the backbone group after its scores stop
  # qualifying. This is not politeness — it is a correctness fix. CoreScope's
  # scores run over a rolling window of recent packets, so a repeater that
  # dies stops scoring within about a day. Judged on the current score alone,
  # a core repeater going down would demote itself out of the critical group
  # and the board would downgrade the outage at exactly the moment it mattered
  # most. 0 disables the grace period.
  core_grace_days: 7

  # Services the mesh depends on that cannot be inferred from packets.
  # Probed on a timer and cached, so a public page never becomes a request
  # amplifier. kind is "http" (any response under 500 counts) or "tcp" (the
  # port accepts a connection).
  #
  # Note there is deliberately no MQTT probe below. The broker is not
  # reachable from outside its own network, so a TCP check would show a
  # permanent red for something that is working — and a status page that
  # cries wolf is worse than one that stays quiet. The real signal for broker
  # health is already on the board: if MQTT stops, every observer stops
  # checking in at once, and the Observers group turns red together.
  service_interval: 60s
  services: []
  #  - name: "CoreScope"
  #    target: "https://corescope.example/api/observers"
  #    note: "Collects and decodes the mesh traffic this page is built from."
  #  - name: "MQTT broker"
  #    kind: tcp
  #    target: "broker.example:8883"
  #    note: "Where observer stations publish everything they hear." 
